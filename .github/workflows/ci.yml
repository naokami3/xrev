name: CI

# コードの追加・修正がリモートに来たら必ずテストを通す（マージ前の最終ゲート）。
on:
  push:
    branches: [main]
  pull_request:

# fork からの PR 実行も含め、必要最小限の権限に絞る。
permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        # macOS 実機運用が前提のため、ps の tpgid/comm 挙動差を CI でも検出できるよう
        # ubuntu に加えて macos-latest でも走らせる。
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: バージョン確認
        run: |
          bash --version | head -1
          python3 --version
      - name: 検証（構文 + JSON + ユニットテスト）
        run: bash tools/verify.sh
