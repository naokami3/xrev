<figure class="fig">
<svg viewBox="0 0 880 470" role="img" aria-labelledby="fig-rm1">
<title id="fig-rm1">参照モードのシーケンス: primary が diff-hash と HEAD の期待値を添えて diff 本文なしの参照 payload を送り、reviewer が自分の作業ツリーで同じ diff-hash を実行して返し、全一致した応答だけが採用される。不一致は reference_unverified として再試行になる。</title>
<defs>
<marker id="m-rm1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="var(--fg)"/>
</marker>
</defs>
<rect x="40" y="20" width="180" height="36" class="box-accent"/>
<text x="130" y="43" class="strong" text-anchor="middle">primary</text>
<rect x="350" y="20" width="180" height="36" class="box"/>
<text x="440" y="43" class="strong" text-anchor="middle">review-loop / transport</text>
<rect x="660" y="20" width="180" height="36" class="box-ok"/>
<text x="750" y="43" class="strong" text-anchor="middle">reviewer（read-only）</text>
<path class="life" d="M 130 56 V 440"/>
<path class="life" d="M 440 56 V 440"/>
<path class="life" d="M 750 56 V 440"/>

<text x="40" y="86" class="small">1. 期待値の確定（単一の真実源 = transport.sh diff-hash）</text>
<rect x="40" y="94" width="330" height="40" class="box"/>
<text x="54" y="110" class="mono">EXPECT_HASH = transport.sh diff-hash &lt;range&gt;</text>
<text x="54" y="126" class="mono">EXPECT_HEAD = git rev-parse HEAD</text>

<path class="arrow" d="M 130 150 H 435" marker-end="url(#m-rm1)"/>
<text x="150" y="144" class="small">2. 参照 payload（diff 本文なし: 実装要約 + 変更ファイル一覧 + 実行指示）</text>

<path class="arrow" d="M 440 186 H 745" marker-end="url(#m-rm1)"/>
<text x="460" y="180" class="small">3. wire 送信（参照モードは切り詰め検出をスキップ — 完全性は 5. の照合が担う）</text>

<rect x="600" y="204" width="264" height="56" class="box"/>
<text x="614" y="224" class="small">4. reviewer が自分の作業ツリーで実行:</text>
<text x="614" y="242" class="mono">同じ transport.sh diff-hash &lt;range&gt;</text>
<text x="614" y="256" class="mono">git rev-parse HEAD</text>

<path class="arrow-dash" d="M 745 286 H 445" marker-end="url(#m-rm1)"/>
<text x="460" y="280" class="small">5. review JSON + reference_context {mode, status, head, diff_hash}</text>

<rect x="350" y="304" width="260" height="64" class="box-err"/>
<text x="480" y="326" class="strong" text-anchor="middle">全一致照合（採用前）</text>
<text x="480" y="346" class="small" text-anchor="middle">mode / status / head==EXPECT_HEAD /</text>
<text x="480" y="360" class="small" text-anchor="middle">diff_hash==EXPECT_HASH の 4 条件すべて</text>

<path class="arrow" d="M 400 368 L 220 400" marker-end="url(#m-rm1)"/>
<text x="240" y="388" class="small">一致</text>
<rect x="80" y="400" width="220" height="40" class="box-ok"/>
<text x="190" y="418" class="strong" text-anchor="middle">レビューを採用</text>
<text x="190" y="434" class="small" text-anchor="middle">通常の decision 判定へ</text>

<path class="arrow" d="M 560 368 L 680 400" marker-end="url(#m-rm1)"/>
<text x="636" y="380" class="small">不一致 / 未取得</text>
<rect x="580" y="400" width="280" height="40" class="box-ref"/>
<text x="720" y="418" class="strong" text-anchor="middle">reference_unverified（exit 0）</text>
<text x="720" y="434" class="small" text-anchor="middle">同一 ITER 再試行: codex=inline / claude=参照のまま</text>

<text x="40" y="464" class="small">diff 一致だけでは基底相違を防げないため HEAD OID も照合する。安定窓: payload 送信〜応答受領まで primary は作業ツリーを編集しない。</text>
</svg>
<figcaption>図: 参照モードの往復。再試行の通算が max_reference_fallbacks を超えると escalate（無限往復防止）。</figcaption>
</figure>
